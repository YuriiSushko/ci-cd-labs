name: ci-lab
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visits
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d visits"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: my-app:step3
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/visits
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: